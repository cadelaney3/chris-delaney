
app = "personal-site-api-cadelaney3"
primary_region = "sjc"

[build]

[env]
  # Comma-separated origins allowed to call the API (your GitHub Pages URL).
  ALLOWED_ORIGINS = "https://chrisdelaney.dev,https://www.chrisdelaney.dev,https://cadelaney3.github.io"
  # Contact-form messages are emailed here (needs the RESEND_API_KEY secret).
  CONTACT_TO = "cadelaney3@gmail.com"
  # Verified with Resend (DKIM/SPF records on Cloudflare), so mail comes from our own domain.
  CONTACT_FROM = "Chris Delaney (website) <contact@chrisdelaney.dev>"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

# Persistent storage for contact-form messages.
# Create once with: fly volumes create contact_data --size 1
[mounts]
  source = "contact_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
